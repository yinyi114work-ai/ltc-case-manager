<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>長照研究室｜碼別法規與函釋速查</title><style>
:root{--bg:#f8f4ec;--card:#fffdfa;--ink:#2f3b46;--muted:#6f7a83;--blue:#6f96a8;--yellow:#e8c86b;--line:#ddd4c8;--warn:#fff3c9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif}.wrap{max-width:960px;margin:auto;padding:28px 18px 60px}header{margin-bottom:22px}.brand{font-weight:800;letter-spacing:.04em}.brand span{background:var(--yellow);padding:4px 9px;border-radius:10px}.sub{color:var(--muted);margin-top:10px}.search{display:flex;gap:10px;position:sticky;top:0;padding:12px 0;background:linear-gradient(var(--bg) 80%,transparent);z-index:5}.search input{flex:1;font-size:20px;padding:15px 18px;border:2px solid var(--blue);border-radius:16px;background:#fff;outline:none}.search button{border:0;border-radius:16px;padding:0 20px;background:var(--blue);color:white;font-weight:700}.hint,.count{color:var(--muted);font-size:14px}.grid{display:grid;gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 4px 18px rgba(60,50,40,.05)}.code{font-size:24px;font-weight:900}.title{font-size:20px;font-weight:700;margin:3px 0 12px}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.tag{font-size:12px;background:#edf3f5;padding:5px 8px;border-radius:99px}.tag.warn{background:var(--warn)}details{border-top:1px dashed var(--line);padding-top:12px;margin-top:12px}summary{cursor:pointer;font-weight:700}.raw{white-space:pre-wrap;font-size:14px;line-height:1.7;margin-top:10px;background:#f6f3ed;padding:14px;border-radius:12px;overflow:auto}.interp{border-left:5px solid var(--yellow)}.meta{font-size:13px;color:var(--muted);margin-bottom:8px}.summary{line-height:1.75}.source{display:inline-block;margin-top:10px;color:#35677c;font-weight:700;text-decoration:none}.empty{text-align:center;padding:40px;color:var(--muted)}footer{margin-top:28px;font-size:13px;color:var(--muted);line-height:1.7}@media(max-width:620px){.search button{display:none}.code{font-size:22px}.title{font-size:18px}}
</style></head><body><div class="wrap"><header><div class="brand"><span>長照研究室</span>　碼別法規與函釋速查</div><div class="sub">輸入碼別或關鍵字，例如：BA13、陪同外出、復健、洗腎。</div></header><div class="search"><input id="q" autofocus placeholder="輸入碼別或服務名稱"><button id="go">查詢</button></div><div id="count" class="count"></div><div id="results" class="grid"></div><footer>資料基礎：衛生福利部《長期照顧服務申請及給付辦法》附表四、附表四之一，以及衛福部與地方政府公開之函釋索引。此工具為速查整理，不取代主管機關個案審核、正式函文或最新法規。資料版本：115年7月。</footer></div><script src="data.js"></script><script>
const q=document.querySelector('#q'),results=document.querySelector('#results'),count=document.querySelector('#count');
const norm=s=>(s||'').toString().toLowerCase().replace(/[\s()（）－—_-]/g,'');
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){const term=norm(q.value); if(!term){results.innerHTML='<div class="empty">輸入 BA13 試試看。</div>';count.textContent='';return}
 const codes=CODE_DATA.filter(x=>norm(x.searchText).includes(term)).slice(0,30);
 const ints=INTERPRETATIONS.filter(x=>norm([x.codes,x.title,x.summary,x.keywords,x.docNo].join(' ')).includes(term));
 count.textContent=`找到 ${codes.length} 筆碼別資料、${ints.length} 筆相關函釋`;
 let h=''; codes.forEach(x=>{h+=`<section class="card"><div class="code">${esc(x.code)}</div><div class="title">${esc(x.title)}</div><div class="tags"><span class="tag">現行給付規定</span>${x.prices?.length?`<span class="tag">支付價格：${esc(x.prices.join('／'))}</span>`:''}</div><details><summary>展開法規原文整理</summary><div class="raw">${esc(x.raw)}</div></details></section>`});
 ints.forEach(x=>{h+=`<section class="card interp"><div class="meta">${esc(x.date)}｜${esc(x.docNo)}</div><div class="title">${esc(x.title)}</div><div class="tags"><span class="tag warn">函釋／實務補充</span><span class="tag">${esc(x.status)}</span></div><div class="summary">${esc(x.summary)}</div><a class="source" href="${esc(x.source)}" target="_blank" rel="noopener">查看官方或政府公開來源 ↗</a></section>`});
 results.innerHTML=h||'<div class="empty">目前沒有找到資料。可改用碼別、服務名稱或情境關鍵字。</div>'}
q.addEventListener('input',render);document.querySelector('#go').onclick=render;q.value='BA13';render();</script></body></html>
